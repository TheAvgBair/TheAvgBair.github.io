name: Static site CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, proxmox, portfolio-quality, theavgbair-site]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate required pages
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s support.html
          test -s privacy.html
          test -s stashpin/support.html
          test -s stashpin/privacy.html
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --include='*.html' .; then exit 1; fi

